[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "siteview-atlas"
version = "0.1.0"
description = "Offline 360-video reconstruction pipeline for SiteView Atlas"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pydantic>=2.9,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
atlas = "atlas.cli:app"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests/atlas"]
addopts = "--strict-markers --strict-config"
