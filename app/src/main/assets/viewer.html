<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  #err { color: #fff; font-family: sans-serif; padding: 24px; text-align: center; direction: rtl; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// نمایشگر 360 بدون وابستگی: عکس equirectangular را با WebGL رندر می‌کند.
var yaw = 0, pitch = 0, fov = 75;
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl');
var img = new Image();
var params = new URLSearchParams(location.search);

img.onload = init;
img.onerror = fail;
img.src = params.get('img');

function fail() {
  document.body.innerHTML = '<div id="err">خطا در بارگذاری تصویر ۳۶۰</div>';
}

function init() {
  if (!gl) { fail(); return; }

  var vsSrc =
    'attribute vec2 p;' +
    'varying vec2 v;' +
    'void main() { v = p; gl_Position = vec4(p, 0.0, 1.0); }';

  var fsSrc =
    'precision highp float;' +
    'varying vec2 v;' +
    'uniform sampler2D tex;' +
    'uniform float yaw, pitch, tanFov, aspect;' +
    'const float PI = 3.141592653589793;' +
    'void main() {' +
    '  vec3 d = normalize(vec3(v.x * tanFov * aspect, v.y * tanFov, -1.0));' +
    '  float cp = cos(pitch), sp = sin(pitch);' +
    '  d = vec3(d.x, cp * d.y - sp * d.z, sp * d.y + cp * d.z);' +
    '  float cy = cos(yaw), sy = sin(yaw);' +
    '  d = vec3(cy * d.x + sy * d.z, d.y, -sy * d.x + cy * d.z);' +
    '  float lon = atan(d.x, -d.z);' +
    '  float lat = asin(clamp(d.y, -1.0, 1.0));' +
    '  vec2 uv = vec2(lon / (2.0 * PI) + 0.5, 0.5 - lat / PI);' +
    '  gl_FragColor = texture2D(tex, uv);' +
    '}';

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  // اگر عکس از حداکثر سایز تکسچر GPU بزرگ‌تر بود، کوچکش می‌کنیم
  var maxSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  var src = img;
  if (img.width > maxSize || img.height > maxSize) {
    var k = Math.min(maxSize / img.width, maxSize / img.height);
    var cv = document.createElement('canvas');
    cv.width = Math.floor(img.width * k);
    cv.height = Math.floor(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    src = cv;
  }
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  var uYaw = gl.getUniformLocation(prog, 'yaw');
  var uPitch = gl.getUniformLocation(prog, 'pitch');
  var uTanFov = gl.getUniformLocation(prog, 'tanFov');
  var uAspect = gl.getUniformLocation(prog, 'aspect');

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  function render() {
    gl.uniform1f(uYaw, yaw);
    gl.uniform1f(uPitch, pitch);
    gl.uniform1f(uTanFov, Math.tan(fov * Math.PI / 360));
    gl.uniform1f(uAspect, canvas.width / canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // کنترل لمسی: کشیدن = چرخش، دو انگشت = زوم
  var pointers = new Map();
  var lastPinch = 0;

  canvas.addEventListener('pointerdown', function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) lastPinch = pinchDist();
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', function (e) {
    var prev = pointers.get(e.pointerId);
    if (!prev) return;
    if (pointers.size === 1) {
      var perPixel = (fov * Math.PI / 180) / canvas.clientHeight;
      yaw += (e.clientX - prev.x) * perPixel;
      pitch += (e.clientY - prev.y) * perPixel;
      var lim = Math.PI / 2 - 0.01;
      pitch = Math.max(-lim, Math.min(lim, pitch));
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      var d = pinchDist();
      if (lastPinch > 0) {
        fov = Math.max(30, Math.min(110, fov * lastPinch / d));
      }
      lastPinch = d;
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    lastPinch = 0;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  function pinchDist() {
    var pts = Array.from(pointers.values());
    if (pts.length < 2) return 0;
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  }
}
</script>
</body>
</html>
