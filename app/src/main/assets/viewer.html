<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  #err { color: #fff; font-family: sans-serif; padding: 24px; text-align: center; direction: rtl; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// نمایشگر 360 بدون وابستگی: عکس equirectangular را با WebGL رندر می‌کند.
var yaw = 0, pitch = 0, fov = 75;
var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl');
var img = new Image();
var params = new URLSearchParams(location.search);

function fail(msg) {
  document.body.innerHTML = '<div id="err">خطا در نمایش ۳۶۰<br><small style="direction:ltr">' +
    String(msg).slice(0, 300) + '</small></div>';
}

window.onerror = function (m, s, l) { fail(m + ' @' + l); };

console.log('viewer start, img param=' + params.get('img'));
img.onload = function () {
  console.log('img loaded ' + img.width + 'x' + img.height);
  try { init(); } catch (e) { fail(e); }
};
img.onerror = function () { fail('image load failed: ' + img.src); };
img.src = params.get('img');

function init() {
  if (!gl) { fail('WebGL not available'); return; }

  var vsSrc =
    'attribute vec2 p;' +
    'varying vec2 v;' +
    'void main() { v = p; gl_Position = vec4(p, 0.0, 1.0); }';

  var fsSrc =
    'precision highp float;' +
    'varying vec2 v;' +
    'uniform sampler2D tex;' +
    'uniform float yaw, pitch, tanFov, aspect;' +
    'const float PI = 3.141592653589793;' +
    'void main() {' +
    '  vec3 d = normalize(vec3(v.x * tanFov * aspect, v.y * tanFov, -1.0));' +
    '  float cp = cos(pitch), sp = sin(pitch);' +
    '  d = vec3(d.x, cp * d.y - sp * d.z, sp * d.y + cp * d.z);' +
    '  float cy = cos(yaw), sy = sin(yaw);' +
    '  d = vec3(cy * d.x + sy * d.z, d.y, -sy * d.x + cy * d.z);' +
    '  float lon = atan(d.x, -d.z);' +
    '  float lat = asin(clamp(d.y, -1.0, 1.0));' +
    '  vec2 uv = vec2(lon / (2.0 * PI) + 0.5, 0.5 - lat / PI);' +
    '  gl_FragColor = texture2D(tex, uv);' +
    '}';

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  var vs = compile(gl.VERTEX_SHADER, vsSrc);
  var fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  console.log('vs compiled=' + gl.getShaderParameter(vs, gl.COMPILE_STATUS) +
    ' fs compiled=' + gl.getShaderParameter(fs, gl.COMPILE_STATUS) +
    ' fsLog=' + gl.getShaderInfoLog(fs));
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    fail('shader link failed: ' + gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  // اگر عکس از حداکثر سایز تکسچر GPU بزرگ‌تر بود، کوچکش می‌کنیم
  var maxSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  var src = img;
  if (img.width > maxSize || img.height > maxSize) {
    var k = Math.min(maxSize / img.width, maxSize / img.height);
    var cv = document.createElement('canvas');
    cv.width = Math.floor(img.width * k);
    cv.height = Math.floor(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    src = cv;
  }
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  console.log('texture uploaded, glError=' + gl.getError());

  var uYaw = gl.getUniformLocation(prog, 'yaw');
  var uPitch = gl.getUniformLocation(prog, 'pitch');
  var uTanFov = gl.getUniformLocation(prog, 'tanFov');
  var uAspect = gl.getUniformLocation(prog, 'aspect');

  // اندازه‌ی بوم هر فریم چک می‌شود؛ WebView اندروید گاهی صفحه را قبل از
  // layout نهایی لود می‌کند و رویداد resize قابل اتکا نیست.
  function syncSize() {
    var dpr = window.devicePixelRatio || 1;
    var w = Math.floor((canvas.clientWidth || window.innerWidth) * dpr);
    var h = Math.floor((canvas.clientHeight || window.innerHeight) * dpr);
    if (w > 0 && h > 0 && (w !== canvas.width || h !== canvas.height)) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
      console.log('canvas resized to ' + w + 'x' + h);
    }
  }

  var firstFrame = true;
  function render() {
    syncSize();
    if (canvas.width > 0 && canvas.height > 0) {
      gl.uniform1f(uYaw, yaw);
      gl.uniform1f(uPitch, pitch);
      gl.uniform1f(uTanFov, Math.tan(fov * Math.PI / 360));
      gl.uniform1f(uAspect, canvas.width / canvas.height);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      if (firstFrame) {
        firstFrame = false;
        var px = new Uint8Array(4);
        gl.readPixels(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2),
          1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        console.log('first frame drawn, canvas=' + canvas.width + 'x' + canvas.height +
          ' glError=' + gl.getError() + ' centerPixel=' + px.join(','));
      }
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // کنترل لمسی: کشیدن = چرخش، دو انگشت = زوم
  var pointers = new Map();
  var lastPinch = 0;

  canvas.addEventListener('pointerdown', function (e) {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) lastPinch = pinchDist();
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', function (e) {
    var prev = pointers.get(e.pointerId);
    if (!prev) return;
    if (pointers.size === 1) {
      var perPixel = (fov * Math.PI / 180) / canvas.clientHeight;
      yaw += (e.clientX - prev.x) * perPixel;
      pitch += (e.clientY - prev.y) * perPixel;
      var lim = Math.PI / 2 - 0.01;
      pitch = Math.max(-lim, Math.min(lim, pitch));
    }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      var d = pinchDist();
      if (lastPinch > 0) {
        fov = Math.max(30, Math.min(110, fov * lastPinch / d));
      }
      lastPinch = d;
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    lastPinch = 0;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  function pinchDist() {
    var pts = Array.from(pointers.values());
    if (pts.length < 2) return 0;
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return Math.sqrt(dx * dx + dy * dy);
  }
}
</script>
</body>
</html>
